<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarwanAlgo | التداول الذكي</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; }
        
        /* القسم الترحيبي */
        .welcome-section { padding: 40px 0; }
        .welcome-img { width: 100%; max-width: 300px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }

        /* الباقات */
        .card { background: #1e293b; padding: 25px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn { background: #22c55e; color: #fff; padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-red { background: #e11d48; }

        /* التحكم في الصفحات */
        .page { display: none; animation: fadeIn 0.5s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        .vodafone-msg { background: #0f172a; padding: 15px; border-radius: 10px; border: 1px dashed #38bdf8; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصفحة 1: الترحيب والباقات -->
        <div id="page1" class="page active">
            <div class="welcome-section">
                <img src="https://images.unsplash.com/photo-1642543492481-44e81e3914a7?w=500" alt="Trading" class="welcome-img">
                <h1>MarwanAlgo</h1>
                <p>حول تداولك إلى تجربة آلية مربحة. دقة، سرعة، وأمان لحسابك في MetaTrader 5.</p>
            </div>
            
            <div class="card">
                <h3>الباقة الأسبوعية</h3>
                <div style="font-size: 24px; font-weight: bold;">$19</div>
                <button class="btn" onclick="nextPage(1)">اختر الأسبوعي</button>
            </div>
            <div class="card">
                <h3>الباقة الشهرية</h3>
                <div style="font-size: 24px; font-weight: bold;">$49</div>
                <button class="btn" onclick="nextPage(2)">اختر الشهري</button>
            </div>
        </div>

        <!-- الصفحة 2: إدخال البيانات -->
        <div id="page2" class="page">
            <h2>إتمام الاشتراك</h2>
            <div class="vodafone-msg">
                حول المبلغ المطلوب إلى فودافون كاش على الرقم:<br>
                <strong style="color: #facc15; font-size: 20px;">01028365021</strong>
            </div>
            <input type="text" id="name" placeholder="الاسم الكامل">
            <input type="text" id="phone" placeholder="رقم الواتساب">
            <input type="number" id="account" placeholder="رقم حساب MT5">
            <button class="btn btn-red" onclick="finish()">تأكيد وإرسال البيانات</button>
        </div>

        <!-- الصفحة 3: النجاح -->
        <div id="page3" class="page">
            <h1 style="color: #22c55e;">تم الطلب بنجاح!</h1>
            <p>نحن بانتظار إيصال التحويل الخاص بك لتفعيل البوت فوراً.</p>
            <button class="btn" onclick="sendWhatsApp()">إرسال الإيصال عبر واتساب</button>
        </div>
    </div>

    <script>
        let selectedPlan = "";
        function nextPage(planId) {
            selectedPlan = planId === 1 ? "أسبوعي ($19)" : "شهري ($49)";
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
        }

        function finish() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page3').classList.add('active');
        }

        function sendWhatsApp() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const acc = document.getElementById('account').value;
            const msg = `طلب جديد:%0aالباقة: ${selectedPlan}%0aالاسم: ${name}%0aالواتساب: ${phone}%0aحساب MT5: ${acc}%0a%0aمرفق إيصال التحويل (فودافون كاش)`;
            window.open(`https://wa.me/201028365021?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
