<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MarwanAlgo | احتراف التداول</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1e293b, #312e81, #0f172a); 
            background-attachment: fixed;
            color: #fff; margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .page { display: none; }
        .active { display: block; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; background: rgba(255,255,255,0.9); color: #000; box-sizing: border-box; }
        .btn { background: #8b5cf6; color: #fff; padding: 15px; border-radius: 12px; border: none; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #6d28d9; }
        h1, h2 { color: #fff; margin-bottom: 20px; }
        .price-box { background: #facc15; color: #000; padding: 15px; border-radius: 15px; margin: 10px 0; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. تسجيل الدخول -->
    <div id="p1" class="page active card">
        <h1>MarwanAlgo</h1>
        <p>ابدأ رحلة التداول الاحترافية</p>
        <input type="text" id="user" placeholder="اسم المستخدم">
        <input type="password" placeholder="كلمة المرور">
        <button class="btn" onclick="show('p2')">تسجيل الدخول</button>
        <p style="margin-top:20px; font-size: 14px; cursor: pointer;" onclick="alert('قم بإنشاء حساب جديد أولاً عبر إدخال بياناتك!')">ليس لديك حساب؟ <u>إنشاء حساب جديد</u></p>
    </div>

    <!-- 2. الرئيسية -->
    <div id="p2" class="page card">
        <h2>اختر باقتك</h2>
        <div class="price-box" onclick="goToPay('الأسبوعي', '$19')">الأسبوعي - $19</div>
        <div class="price-box" onclick="goToPay('الشهري', '$49')">الشهري - $49</div>
        <div class="price-box" onclick="goToPay('السنوي', '$399')">السنوي - $399</div>
    </div>

    <!-- 3. الدفع -->
    <div id="p3" class="page card">
        <h2 style="color: #facc15;">فودافون كاش: 01028365021</h2>
        <p>قم بالتحويل ثم أكمل البيانات</p>
        <input type="text" id="firstName" placeholder="الاسم الأول">
        <input type="text" id="phoneNum" placeholder="رقم واتساب">
        <input type="text" id="mt5" placeholder="رقم حساب MT5">
        <button class="btn" onclick="checkPay()">تأكيد التحويل</button>
    </div>

    <!-- 4. النهاية -->
    <div id="p4" class="page card">
        <h2 style="color:#22c55e">جاري المراجعة...</h2>
        <p>سيقوم مروان بالتواصل معك عبر واتساب لتفعيل البوت فور التأكد من التحويل.</p>
        <button class="btn" onclick="finalWhatsApp()">تواصل معي الآن</button>
    </div>
</div>

<script>
    let userData = {};
    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function goToPay(p, pr) { userData.plan = p + " " + pr; show('p3'); }
    function checkPay() {
        if(document.getElementById('firstName').value === "") { alert("أدخل الاسم أولاً!"); return; }
        show('p4');
    }
    function finalWhatsApp() {
        const msg = `طلب تفعيل ${userData.plan}%0aالاسم: ${document.getElementById('firstName').value}`;
        window.open(`https://wa.me/201028365021?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
